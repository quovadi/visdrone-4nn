name: Stage 5 CPU validation

on:
  pull_request:
    branches:
      - feature/square-query-trajectories
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage5-cpu-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests and synthetic smoke (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLCONFIGDIR: ${{ runner.temp }}/mplconfig
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1 torchvision==0.20.1

      - name: Install project requirements
        run: python -m pip install -r requirements.txt

      - name: Compile source and tests
        run: python -m compileall -q attacks training data tests

      - name: Run complete test suite
        run: python -m pytest -q

      - name: Run Stage 5 synthetic integration smoke
        run: python -m attacks.patch_smoke --output "${{ runner.temp }}/stage5-smoke"

      - name: Check patch whitespace
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          git diff --check "origin/$BASE_REF...HEAD"
